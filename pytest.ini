[pytest]
pythonpath = .
addopts = --alluredir allure-results --clean-alluredir

# ---------------------------------------------------------------------------
# Logging – real-time console output in CI/CD (complements Allure report)
# ---------------------------------------------------------------------------
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-8s] %(name)s – %(message)s
log_cli_date_format = %H:%M:%S

# ---------------------------------------------------------------------------
# pytest-xdist – parallel execution
# ---------------------------------------------------------------------------
# Uncomment and adjust -n to enable parallel execution:
#   -n auto        – one worker per available CPU core
#   -n 4           – fixed number of workers
#   --dist loadscope – tests in the same module share a worker (respects
#                       module-scoped fixtures and avoids DB conflicts)
#
# addopts = … -n auto --dist loadscope

# ---------------------------------------------------------------------------
# Test markers
# ---------------------------------------------------------------------------
markers =
    ui: marks tests as UI (Selenium) tests
    api: marks tests as API tests
    slow: marks tests known to be slow
